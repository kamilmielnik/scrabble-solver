name: bunx

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 0 * * *' # every day at 00:00 UTC
  workflow_dispatch: # allow manual triggering

jobs:
  bunx:
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
      - uses: actions/checkout@v6
      - name: Wait for the released version to be published on npm
        run: |
          VERSION=$(node -p "require('./lerna.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Target version: $VERSION"
          # Every non-private workspace package (published by `lerna publish`). All version in lockstep.
          PACKAGES=$(node -p "require('fs').readdirSync('packages').map(d=>require('./packages/'+d+'/package.json')).filter(p=>!p.private).map(p=>p.name).join(' ')")
          echo "Waiting for: $PACKAGES"
          for pkg in $PACKAGES; do
            for i in $(seq 1 60); do
              if [ "$(npm view "$pkg@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
                echo "✓ $pkg@$VERSION is available"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "::error::Timed out waiting for $pkg@$VERSION on npm" >&2
                exit 1
              fi
              echo "… $pkg@$VERSION not available yet (attempt $i/60); sleeping 15s"
              sleep 15
            done
          done
      # The specs of the released version: specs from master could cover features which are not released yet.
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Install the published package globally
        run: bun add --global scrabble-solver@${{ env.VERSION }}
      - name: Pre-warm dictionaries cache
        run: bunx --package @scrabble-solver/dictionaries@"$VERSION" update-dictionaries
        working-directory: ${{ runner.temp }}
      # The absolute path, because node_modules/.bin holds an unbuilt binary of the workspace package.
      - name: Run e2e tests against the global binary
        run: bunx start-server-and-test "$(bun pm bin --global)/scrabble-solver" http://localhost:3333 'bunx playwright test'
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3333
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
