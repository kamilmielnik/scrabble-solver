name: Tarballs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tarballs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx tsc --project scripts
      - run: bun run check-tarballs
