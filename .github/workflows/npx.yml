name: npx

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 0 * * *' # every day at 00:00 UTC
  workflow_dispatch: # allow manual triggering

jobs:
  npx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/checkout@v6
      - name: Wait for the released version to be published on npm
        run: |
          VERSION=$(node -p "require('./lerna.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Target version: $VERSION"
          # Every non-private workspace package (published by `lerna publish`). All version in lockstep.
          PACKAGES=$(node -p "require('fs').readdirSync('packages').map(d=>require('./packages/'+d+'/package.json')).filter(p=>!p.private).map(p=>p.name).join(' ')")
          echo "Waiting for: $PACKAGES"
          for pkg in $PACKAGES; do
            for i in $(seq 1 60); do
              if [ "$(npm view "$pkg@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
                echo "✓ $pkg@$VERSION is available"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "::error::Timed out waiting for $pkg@$VERSION on npm" >&2
                exit 1
              fi
              echo "… $pkg@$VERSION not available yet (attempt $i/60); sleeping 15s"
              sleep 15
            done
          done
      # The specs of the released version: specs from master could cover features which are not released yet.
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VERSION }}
      # Only the test tools from the root package. Bun stays off this runner: the app must not need it.
      - run: npm install --no-save --no-package-lock --ignore-scripts --workspaces=false
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Install the published package globally
        run: npm install --global scrabble-solver@${{ env.VERSION }}
      - name: Pre-warm dictionaries cache
        run: npx --yes --package @scrabble-solver/dictionaries@"$VERSION" update-dictionaries
        working-directory: ${{ runner.temp }}
      - name: Run e2e tests against the global binary
        run: npx start-server-and-test scrabble-solver http://localhost:3333 'npx playwright test'
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3333
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
